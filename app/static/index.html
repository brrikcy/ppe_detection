<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPE Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 22a12 12 0 0 1 24 0z' fill='%23e8c400'/%3E%3Crect x='2' y='22' width='28' height='4' rx='2' fill='%23e8c400'/%3E%3C/svg%3E">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Runs">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 22a12 12 0 0 1 24 0z"/><rect x="2" y="22" width="28" height="4" rx="2"/></svg>
        <span>PPE Inspector</span>
      </div>
      <a class="btn btn-primary btn-block" href="#new">New inspection</a>
      <div class="runs-head">
        <span class="eyebrow">Runs</span>
        <span class="eyebrow" id="runs-count"></span>
      </div>
      <nav id="runs-list" class="runs-list"></nav>
    </aside>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script src="/js/app.js" type="module"></script>
</body>
</html>
